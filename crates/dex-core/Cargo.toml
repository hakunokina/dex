[package]
name = "dex-core"
version = "0.1.0"
description = "Dex çekirdeği: PTY, hook/MCP alıcısı, SQLite, hafıza, sağlayıcılar — arayüzden bağımsız"
authors = ["hakunokina"]
edition = "2021"

# No `tauri` here, ever: the desktop shell and `dexd` both sit on top of this crate.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
getrandom = "0.3"
portable-pty = "0.9"
vt100 = "0.16.2"
# DEX-25: Yerel LLM (LiteLLM) model listesi/kaydı — küçük, bloklayan HTTP istemcisi.
ureq = { version = "2", features = ["json"] }
notify = "8.2.0"
# Görev #289: GPU broker çıktısının sha256 doğrulaması (dexd zaten kullanıyor).
sha2 = "0.10"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Gateway: HTTPS without environment proxies, redirects or automatic retries.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
base64 = "0.22"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# #425: kullanıcının ~/.codex/config.toml MCP tablolarını profile tam kopyalamak için.
toml = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Wdk_System_Threading"] }
# DEX-13: sağlayıcı jetonları Credential Manager'da (DB/config/log'a asla yazılmaz).
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
