[package]
name = "dex-core"
version = "0.2.0"
description = "Dex çekirdeği: PTY, hook/MCP alıcısı, SQLite, hafıza, sağlayıcılar — arayüzden bağımsız"
authors = ["hakunokina"]
edition = "2021"

# No `tauri` here, ever: the desktop shell and `dexd` both sit on top of this crate.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
getrandom = "0.3"
portable-pty = "0.9"
vt100 = "0.16.2"
# DEX-25: Yerel LLM (LiteLLM) model listesi/kaydı — küçük, bloklayan HTTP istemcisi.
ureq = { version = "2", features = ["json"] }
notify = "8.2.0"
# Görev #289: GPU broker çıktısının sha256 doğrulaması (dexd zaten kullanıyor).
sha2 = "0.10"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
# #1718: FCM servis hesabı JWT imzası (RS256). ureq/rustls üzerinden zaten ağaçta; yeni crate yok.
ring = "0.17"
# Plan #99 mapgen: repo haritası — tree-sitter ayrıştırma (MIT lisanslı gramerler).
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_WindowsProgramming", "Wdk_System_Threading"] }
# DEX-13: sağlayıcı jetonları Credential Manager'da (DB/config/log'a asla yazılmaz).
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
