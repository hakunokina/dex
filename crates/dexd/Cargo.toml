[package]
name = "dexd"
version = "0.1.0"
description = "Dex sunucusu: dex-core'u arayüzsüz barındırır, istemcilere tek WebSocket ucundan sunar"
authors = ["hakunokina"]
edition = "2021"

[dependencies]
dex-core = { path = "../dex-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
getrandom = "0.3"
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-tungstenite = "0.30"

# #150: `dexd --local` — owner-only discovery files (DACL), its own stderr in background.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
